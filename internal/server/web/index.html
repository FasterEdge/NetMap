<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NetMap - 网络拓扑管理器</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--accent:#38bdf8;--accent2:#818cf8;--green:#4ade80}
*{padding:0;margin:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:600}header h1 span{color:var(--accent)}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:8px}
.toolbar button{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.toolbar button:hover{background:var(--accent);color:#000}
.toolbar .status{font-size:12px;color:var(--dim);margin-left:auto}
main{flex:1;display:flex;overflow:hidden}
#graph{flex:1;position:relative;overflow:hidden}
#graph svg{width:100%;height:100%}
.sidebar{width:340px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.sidebar-body{flex:1;overflow-y:auto;padding:8px}
.peer-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.peer-card:hover{border-color:var(--accent)}
.peer-card .name{font-weight:600;font-size:14px}.peer-card .addr{font-size:12px;color:var(--dim)}
.peer-card .role{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--accent);color:#000;margin-top:4px}
.peer-card .time{font-size:11px;color:var(--dim);margin-top:4px}
.self-card{background:var(--bg);border:2px solid var(--accent2);border-radius:8px;padding:12px;margin-bottom:12px}
.self-card .name{font-weight:600;font-size:14px;color:var(--accent2)}
.self-card .detail{font-size:12px;color:var(--dim);margin-top:4px}
.iface-item{font-size:11px;color:var(--dim);padding:2px 0}
.link{stroke:var(--border);stroke-width:2;stroke-opacity:.6}
.link-label{font-size:10px;fill:var(--dim)}
</style>
</head>
<body>
<header>
  <h1><span>Net</span>Map</h1>
  <div class="meta" id="headerMeta">拓扑管理器</div>
</header>
<div class="toolbar">
  <button onclick="refresh()">⟳ 刷新</button>
  <button onclick="autoRefresh()" id="autoBtn">▶ 自动刷新</button>
  <span class="status" id="status">等待数据...</span>
</div>
<main>
  <div id="graph"></div>
  <div class="sidebar">
    <div class="sidebar-header"><span>节点列表</span><span id="peerCount">0</span></div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </div>
</main>
<script>
const API='/api';let topology=null,autoInterval=null;
async function refresh(){
  const st=document.getElementById('status');st.textContent='...';
  try{
    const t=await(await fetch(API+'/topology')).json();
    topology=t;renderTopology(t);renderSidebar(t);
    document.getElementById('headerMeta').textContent='拓扑管理器 · '+(t.peers?.length||0)+' 个对端';
    document.getElementById('peerCount').textContent=(t.peers?.length||0)+(t.self?.nodeName?'+1':'');
    st.textContent=new Date().toLocaleTimeString()+' 已更新';
  }catch(e){st.textContent='失败 '+e.message;}
}
function renderTopology(t){
  const c=document.getElementById('graph'),
    w=c.clientWidth||800,h=c.clientHeight||600,
    peers=t.peers||[],self=t.self||{},
    cx=w/2,cy=h/2,rad=Math.min(w,h)*0.32,
    nodes=[{id:'__self',label:self.nodeName||'本节点',x:cx,y:cy,r:28}],links=[];
  const as=2*Math.PI/Math.max(peers.length,1);
  peers.forEach(function(p,i){
    const a=as*i-Math.PI/2,px=cx+rad*Math.cos(a),py=cy+rad*Math.sin(a);
    nodes.push({id:p.name,x:px,y:py,r:20});links.push({source:'__self',target:p.name,label:p.address});
  });
  let s='<svg viewBox="0 0 '+w+' '+h+'">'+
    '<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse">'+
    '<path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>'+
    '<rect width="100%" height="100%" fill="url(#gr)"/>';
  links.forEach(function(l){
    var sn=nodes.find(function(n){return n.id===l.source}),dn=nodes.find(function(n){return n.id===l.target});
    if(!sn||!dn)return;
    var mx=(sn.x+dn.x)/2,my=(sn.y+dn.y)/2-14;
    s+='<line class="link" x1="'+sn.x+'" y1="'+sn.y+'" x2="'+dn.x+'" y2="'+dn.y+'"/>'+
       '<text class="link-label" x="'+mx+'" y="'+my+'" text-anchor="middle">'+l.label+'</text>';
  });
  var sn=nodes[0];
  s+='<g><circle cx="'+sn.x+'" cy="'+sn.y+'" r="28" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>'+
     '<text x="'+sn.x+'" y="'+(sn.y+4)+'" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">本机</text>'+
     '<text x="'+sn.x+'" y="'+(sn.y+44)+'" text-anchor="middle" fill="#818cf8" font-size="11">'+sn.label+'</text></g>';
  peers.forEach(function(p,i){
    var n=nodes[i+1];if(!n)return;
    var col=p.role==='cloud'?'#38bdf8':p.role==='edge'?'#4ade80':'#94a3b8';
    s+='<g><circle cx="'+n.x+'" cy="'+n.y+'" r="20" fill="#1e293b" stroke="'+col+'" stroke-width="2"/>'+
       '<text x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle" fill="'+col+'" font-size="10" font-weight="500">'+n.id+'</text></g>';
  });
  s+='</svg>';c.innerHTML=s;
}
function renderSidebar(t){
  var body=document.getElementById('sidebarBody'),self=t.self||{},peers=t.peers||[],h='';
  h+='<div class="self-card"><div class="name">'+(self.nodeName||'本节点')+'</div>'+
     (self.defaultIface?'<div class="detail">默认接口: '+self.defaultIface+'</div>':'')+
     (self.interfaces||[]).map(function(i){return '<div class="iface-item">'+i.name+' · '+(i.ipv4||[]).join(', ')+'</div>';}).join('')+
     '<div class="detail" style="margin-top:4px;font-size:11px;color:var(--green)">● 本机</div></div>';
  peers.forEach(function(p){
    h+='<div class="peer-card"><div class="name">'+p.name+'</div><div class="addr">'+p.address+'</div>'+
       (p.role?'<span class="role">'+p.role+'</span>':'')+
       (p.lastSeen?'<div class="time">最后可见: '+new Date(p.lastSeen).toLocaleTimeString()+'</div>':'')+'</div>';
  });
  body.innerHTML=h||'<div style="padding:24px;text-align:center;color:var(--dim)">暂无</div>';
}
function autoRefresh(){
  var b=document.getElementById('autoBtn');
  if(autoInterval){clearInterval(autoInterval);autoInterval=null;b.textContent='▶ 自动刷新';return;}
  autoInterval=setInterval(refresh,5000);b.textContent='⏸ 暂停';refresh();
}
refresh();
</script>
</body>
</html>
